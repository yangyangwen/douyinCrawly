services:
  douyin:
    build:
      context: .
      args:
        FRONTEND_BUILD_IMAGE: ${DOUYIN_FRONTEND_BUILD_IMAGE:-node:20-bookworm-slim}
        PYTHON_RUNTIME_IMAGE: ${DOUYIN_PYTHON_RUNTIME_IMAGE:-python:3.12-slim-bookworm}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_AUTH_TOKEN: ${DOUYIN_API_AUTH_TOKEN}
    ports:
      - "8000:8000"
    container_name: douyin-crawler
    restart: unless-stopped
    environment:
      DOUYIN_HOST: 0.0.0.0
      DOUYIN_PORT: 8000
      DOUYIN_API_AUTH_TOKEN: ${DOUYIN_API_AUTH_TOKEN}
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./download:/app/download
